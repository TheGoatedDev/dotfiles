# Dotfiles manifest — stow packages + skills wiring.
# Brew lives in Brewfile (canonical).

stow:
  - zsh
  - git
  - ghostty
  - opencode
  - tmux

zsh_plugins:
  dir: ~/.zsh/plugins
  repos:
    - https://github.com/zsh-users/zsh-autosuggestions
    - https://github.com/zsh-users/zsh-syntax-highlighting

tmux_plugins:
  dir: ~/.config/tmux/plugins
  repos:
    - https://github.com/tmux-plugins/tpm
    - https://github.com/tmux-plugins/tmux-sensible
    - https://github.com/catppuccin/tmux

skills:
  agent: opencode
  custom_dir: skills/custom
  agents_dir: ~/.agents/skills
  opencode_skills_dir: ~/.config/opencode/skills
  # skills.sh packages (source → skill names). Edit here; ./install --skills-only
  packages:
    JuliusBrussee/caveman:
      - caveman
    mattpocock/skills:
      - grill-me
      - grilling
      - grill-with-docs
    vercel-labs/agent-browser:
      - agent-browser
    upstash/context7:
      - find-docs
    vercel-labs/skills:
      - find-skills
    leonxlnx/taste-skill:
      - design-taste-frontend
    pbakaus/impeccable:
      - impeccable
    vercel-labs/agent-skills:
      - web-design-guidelines
    CFLW-AI/wcag-audit-claude-skill:
      - wcag-audit
    zivtech/accessibility-skills:
      - a11y-planner
      - a11y-critic
      - a11y-test
      - perspective-audit

brewfile: Brewfile

secrets:
  path: ~/.config/secrets/env
  example: env.example

opencode:
  dir: ~/.config/opencode
