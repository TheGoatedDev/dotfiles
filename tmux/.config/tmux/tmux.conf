# Managed by dotfiles (stow). Plugins cloned by ./install → ~/.config/tmux/plugins/

# Sticky prefix: C-a toggles command mode on/off (Esc also exits)
unbind C-b
set -g prefix None
bind -n C-a set key-table prefix \; refresh-client -S
bind -T prefix C-a set key-table root \; refresh-client -S
bind -T prefix Escape set key-table root \; refresh-client -S
bind -T prefix a send-keys C-a

bind -T prefix r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"

set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Panes: hjkl move, HJKL resize (macOS steals Ctrl+arrows for Spaces)
unbind -T prefix C-Left
unbind -T prefix C-Right
unbind -T prefix C-Up
unbind -T prefix C-Down
bind -r -T prefix h select-pane -L
bind -r -T prefix j select-pane -D
bind -r -T prefix k select-pane -U
bind -r -T prefix l select-pane -R
bind -r -T prefix H resize-pane -L 5
bind -r -T prefix J resize-pane -D 5
bind -r -T prefix K resize-pane -U 5
bind -r -T prefix L resize-pane -R 5

set -g visual-activity off
set -g visual-bell off
set -g bell-action none
setw -g monitor-activity off

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g focus-events on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @catppuccin_flavor 'mocha'
# mocha red/green — sticky mode uses key-table, not client_prefix
set -g @catppuccin_session_color "#{?#{==:#{key-table},prefix},#f38ba8,#a6e3a1}"

run '~/.config/tmux/plugins/tpm/tpm'

# TPM runs catppuccin once; drop cached session module and rebuild with our color
set -gu @catppuccin_status_session
set -gu @catppuccin_status_session_icon_bg
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"
