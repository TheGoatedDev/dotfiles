# Managed by dotfiles (stow). Plugins cloned by ./install → ~/.config/tmux/plugins/

# Sticky prefix: C-a toggles command mode on/off (Esc also exits)
unbind C-b
set -g prefix None
bind -n C-a set key-table prefix
bind -T prefix C-a set key-table root
bind -T prefix Escape set key-table root
bind -T prefix a send-keys C-a

bind -T prefix r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"

set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g visual-activity off
set -g visual-bell off
set -g bell-action none
setw -g monitor-activity off

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g focus-events on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @catppuccin_flavor 'mocha'
# mocha red/green — before catppuccin so session module keeps live key-table format
set -g @catppuccin_session_color "#{?#{==:#{key-table},prefix},#f38ba8,#a6e3a1}"

run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"

run '~/.config/tmux/plugins/tpm/tpm'
